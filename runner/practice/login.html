<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Tiệm Trà Mộc</title>
  <link rel="stylesheet" href="/practice/assets/site.css">
  <script src="/practice/assets/site.js"></script>
</head>
<body>
  <main>
    <h1>Đăng nhập</h1>
    <p class="subtitle">Tài khoản thử: <code>lan</code> / <code>matkhau123</code>. Tài khoản bị khóa: <code>khoa</code> / <code>matkhau123</code>.</p>
    <div class="card">
      <form class="form" id="login-form" novalidate>
        <label>Tên đăng nhập
          <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" autocomplete="username">
        </label>
        <label>Mật khẩu
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
        </label>
        <label style="display:flex;gap:8px;font-weight:400">
          <input type="checkbox" id="remember" name="remember"> Ghi nhớ đăng nhập
        </label>
        <div id="error-message" class="alert alert-error hidden" role="alert"></div>
        <button type="submit" class="btn" id="login-btn">Đăng nhập</button>
      </form>
    </div>
  </main>
  <script>
    const ACCOUNTS = { lan: { password: "matkhau123", name: "Lan" }, khoa: { password: "matkhau123", name: "Khoa", locked: true } };
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      const error = document.getElementById("error-message");
      const show = (msg) => { error.textContent = msg; error.classList.remove("hidden"); };
      if (!user) return show("Vui lòng nhập tên đăng nhập");
      if (!pass) return show("Vui lòng nhập mật khẩu");
      const account = ACCOUNTS[user];
      if (!account || account.password !== pass) return show("Sai tên đăng nhập hoặc mật khẩu");
      if (account.locked) return show("Tài khoản của bạn đã bị khóa");
      // A small delay like a real server, so learners see why waits matter.
      document.getElementById("login-btn").disabled = true;
      setTimeout(() => { location.href = "/practice/account.html?name=" + encodeURIComponent(account.name); }, 600);
    });
  </script>
</body>
</html>
